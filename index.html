<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230e8a66'/%3E%3Ctext x='50' y='72' font-size='52' font-family='system-ui' font-weight='700' fill='%23fff' text-anchor='middle'%3E双%3C/text%3E%3C/svg%3E">
<title>虚拟电厂智算舱</title>
<style>
:root{
  --ink:#111827; --ink-2:#374151; --ink-3:#6B7280;
  --line:#E5E7EB; --bg:#F3F4F6; --surface:#FFFFFF;
  --c-vpp:#0e8a66; --c-vpp-soft:#e3f3ec;
  --c-store:#2563EB; --c-store-soft:#EFF6FF;
  --ease:cubic-bezier(.2,.8,.2,1);
  --font-ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
.shellbar{
  height:54px;display:flex;align-items:center;gap:18px;padding:0 20px;
  background:var(--surface);border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(17,24,39,.06);position:relative;z-index:10;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{
  width:30px;height:30px;border-radius:8px;flex:none;
  background:linear-gradient(135deg,var(--c-vpp),#0b6b50);
  color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;
}
.brand b{font-size:15px;letter-spacing:.02em;white-space:nowrap}
.brand span{font-size:11px;color:var(--ink-3);letter-spacing:.08em;white-space:nowrap}
.tabs{display:flex;gap:6px;background:#F1F3F5;border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:8px}
.tab{
  appearance:none;border:0;background:transparent;cursor:pointer;
  padding:7px 16px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--ink-3);
  display:flex;align-items:center;gap:7px;transition:all .18s var(--ease);white-space:nowrap;
}
.tab .dot{width:7px;height:7px;border-radius:50%;background:#C4CBD4;transition:all .18s var(--ease)}
.tab:hover{color:var(--ink-2)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(17,24,39,.10)}
.tab.on .dot{background:var(--tc,var(--c-vpp));box-shadow:0 0 0 3px color-mix(in srgb,var(--tc,var(--c-vpp)) 18%, transparent)}
.tab[data-t="vpp"]{--tc:var(--c-vpp)}
.tab[data-t="storage"]{--tc:var(--c-store)}
.shellbar .sp{flex:1}
.shellbar .meta{font-size:11px;color:var(--ink-3);letter-spacing:.06em;white-space:nowrap}
.stage{position:relative;height:calc(100% - 54px)}
.stage iframe{
  position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg);
}
.stage iframe.on{display:block}
@media (max-width:860px){
  .brand span,.shellbar .meta{display:none}
  .tab{padding:7px 10px}
}
</style>
</head>
<body>
<header class="shellbar">
  <div class="brand">
    <div class="logo">双</div>
    <div><b>虚拟电厂智算舱</b><br><span>GENERATION · STORAGE &amp; SALES</span></div>
  </div>
  <nav class="tabs" role="tablist" aria-label="工作台切换">
    <button class="tab on" data-t="vpp" role="tab" aria-selected="true"><span class="dot"></span>发电类虚拟电厂工作台</button>
    <button class="tab" data-t="storage" role="tab" aria-selected="false"><span class="dot"></span>储售一体测算驾驶舱</button>
  </nav>
  <div class="sp"></div>
  <div class="meta">切换即显 · 各工作台状态独立保留</div>
</header>
<div class="stage">
  <iframe id="f-vpp" class="on" src="index.live.html" title="发电类虚拟电厂工作台"></iframe>
  <iframe id="f-storage" data-src="storage.html" title="储售一体测算驾驶舱"></iframe>
</div>
<script>
(function(){
  var KEY='shell.tab';
  var loaded={vpp:true,storage:false};
  var qs=new URLSearchParams(location.search).get('tab');
  var initial=(qs==='storage'||qs==='vpp')?qs:(localStorage.getItem(KEY)==='storage'?'storage':'vpp');
  function show(t){
    document.querySelectorAll('.tab').forEach(function(b){
      var on=b.dataset.t===t;
      b.classList.toggle('on',on);
      b.setAttribute('aria-selected',on?'true':'false');
    });
    document.querySelectorAll('.stage iframe').forEach(function(f){
      f.classList.toggle('on',f.id==='f-'+t);
    });
    if(!loaded[t]){
      var f=document.getElementById('f-'+t);
      f.src=f.dataset.src;
      loaded[t]=true;
    }
    try{localStorage.setItem(KEY,t);}catch(e){}
  }
  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click',function(){show(b.dataset.t);});
  });
  show(initial);
})();
</script>
</body>
</html>
